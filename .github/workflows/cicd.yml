
name: Hospital Backend CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: hospital-app-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.REGISTRY_NAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

      - name: Build backend image
        run: |
          docker build \
            -t "${{ secrets.REGISTRY_NAME }}/${IMAGE_NAME}:${GITHUB_RUN_NUMBER}" .

      - name: Push backend image
        run: |
          docker push "${{ secrets.REGISTRY_NAME }}/${IMAGE_NAME}:${GITHUB_RUN_NUMBER}"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update deployment image
        env:
          REGISTRY_NAME: ${{ secrets.REGISTRY_NAME }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          sed -i "s#image: .*#image: ${REGISTRY_NAME}/${IMAGE_NAME}:${GITHUB_RUN_NUMBER}#" deployment/deploy.yaml
          grep "image:" deployment/deploy.yaml

      - name: Log in to Azure
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          az login --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID"

          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Connect to AKS
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AKS_CLUSTER: ${{ secrets.AKS_CLUSTER }}
        run: |
          az aks get-credentials \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER" \
            --overwrite-existing

      - name: Apply backend manifests
        run: |
          kubectl apply -f clusterissuer.yaml
          kubectl apply -f deployment/configmap.yaml
          kubectl apply -f deployment/service.yaml
          kubectl apply -f deployment/ingress.yaml
          kubectl apply -f deployment/deploy.yaml

      - name: Verify backend rollout
        run: |
          kubectl rollout status deployment/hospital-backend-deployment --timeout=180s
          kubectl get pods
          kubectl get services
          kubectl get ingress
