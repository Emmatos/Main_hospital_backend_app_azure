apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hospital-backend-ingress
  annotations:
    cert-manager.io/cluster-issuer: production
spec:
  ingressClassName: external-nginx
  tls:
    - hosts:
        - hospitalapi.telcopharmacy.online
      secretName: hospital-backend-tls-secret
  rules:
    - host: hospitalapi.telcopharmacy.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hospital-backend-service
                port:
                  number: 8080
